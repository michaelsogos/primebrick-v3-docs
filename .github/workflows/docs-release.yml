name: docs-release

# Documentation release automation — the trigger that keeps
# docs.primebrick.dev in sync with upstream `main` branches.
#
# Runs every 6h and on manual dispatch. When any upstream repo's `main` moved,
# it syncs pages/, validates the full Zudoku build, and — only if synced
# content actually changed — cuts a patch release to `main`. The push to
# `main` is what wakes Cloudflare's Workers Builds trigger; the tag records
# the release. No human checklist, no manual warmup push.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: docs-release
  cancel-in-progress: false

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Detect upstream docs drift
        id: drift
        run: node scripts/check-docs-drift.mjs

      - name: Sync docs + validate full build
        if: steps.drift.outputs.drift == 'true'
        run: |
          node scripts/sync-repo-docs.mjs
          node scripts/sync-vpat-data.mjs
          node scripts/fetch-openapi.mjs
          node scripts/generate-nav.mjs
          node scripts/generate-vpat-pdf.mjs
          node scripts/compliance-scan.mjs
          node scripts/generate-compliance-pdf.mjs
          pnpm run build

      - name: Commit synced content on develop
        if: steps.drift.outputs.drift == 'true'
        id: synccommit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/ apis/ src/ public/ scripts/docs-sync-state.json
          if git diff --cached --quiet -- ':!scripts/docs-sync-state.json'; then
            echo "Upstream moved but synced content is identical — recording state only."
            git commit -m "chore(docs-sync): record upstream HEADs (no content drift)"
            git push origin develop
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "docs: sync upstream main ($(date -u +%Y-%m-%d))"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release patch to main
        if: steps.drift.outputs.drift == 'true' && steps.synccommit.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VER=$(node -e "const v=require('./package.json').version.split('.').map(Number);console.log(v[0]+'.'+v[1]+'.'+(v[2]+1))")
          git push origin develop
          git checkout -b "release/$VER"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$VER';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          git commit -am "chore(release): $VER"
          git checkout main
          git merge --no-ff "release/$VER" -m "Merge branch 'release/$VER' into main"
          git tag "$VER"
          git push origin main --tags
          git checkout develop
          git merge --no-ff main -m "Merge branch 'main' into develop (release $VER)"
          git push origin develop
          git branch -D "release/$VER"
